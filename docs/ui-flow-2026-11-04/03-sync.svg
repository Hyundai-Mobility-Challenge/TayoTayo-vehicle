<rect x="1020" y="386" width="720" height="97" rx="14" fill="#EAF4F1" stroke="#EAF4F1"/>
<text x="1052.0" y="416.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#182D3E">정류장 진행 + 내 아이 예상 시간</text>
