<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960" role="img" aria-labelledby="title-03-sync"><title id="title-03-sync">통학메이트 · 두 앱의 연결</title><rect width="100%" height="100%" fill="#F5F7FA"/>
<text x="60.0" y="40.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="40" font-weight="700" fill="#182D3E">통학메이트 · 두 앱의 연결</text>
<text x="60.0" y="103.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#536777">차량에서 기록하면, 학부모의 화면과 알림에 반영됩니다.</text>
<text x="120.0" y="190.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#182D3E">차량 앱에서 하는 일</text>
<text x="1090.0" y="190.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#182D3E">학부모가 보는 것</text>
<rect x="60" y="255" width="660" height="97" rx="14" fill="#FFFFFF" stroke="#D6DFE7"/>
<text x="92.0" y="285.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#182D3E">운행 시작</text>
<polyline points="720,303 1020,303" fill="none" stroke="#087E70" stroke-width="3" stroke-dasharray="8 6"/>
