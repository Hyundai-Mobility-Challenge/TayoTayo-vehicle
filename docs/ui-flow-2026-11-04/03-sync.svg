<rect x="60" y="808" width="1680" height="75" rx="14" fill="#FFF5C6" stroke="#FFF5C6"/>
<text x="90.0" y="832.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#182D3E">도착 전 안내</text>
<text x="390.0" y="832.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="400" fill="#182D3E">내 아이의 유효한 예상 시간이 2분 이내이면 접근 알림</text>
<text x="60.0" y="918.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#536777">통학메이트 · 현재 구현을 요약한 화면 흐름 · 2026.11.04</text>
<text x="1710.0" y="918.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#536777">3 / 3</text>
