<polygon points="1230,313 1219.4690092573155,318.75310646325045 1219.4690092573155,307.24689353674955" fill="#087E70"/>
<text x="70.0" y="377.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#536777">준비만으로 출발 알림은 보내지 않음</text>
<rect x="50" y="396" width="540" height="119" rx="14" fill="#FFFFFF" stroke="#D6DFE7"/>
