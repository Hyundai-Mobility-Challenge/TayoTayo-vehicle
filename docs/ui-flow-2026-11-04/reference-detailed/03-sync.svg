<text x="70.0" y="448.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#182D3E">이 순서로 · 운행 시작</text>
<rect x="700" y="396" width="400" height="119" rx="14" fill="#EAF4F1" stroke="#EAF4F1"/>
<text x="720.0" y="419.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700" fill="#182D3E">운행 시작 / Pleos 위치·ETA</text>
<text x="720.0" y="475.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#087E70">자동 전달 · 접근 범위 검사</text>
<rect x="1230" y="396" width="520" height="119" rx="14" fill="#FFFFFF" stroke="#D6DFE7"/>
<text x="1250.0" y="416.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#182D3E">이동 중 + 출발 알림</text>
<text x="1250.0" y="458.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#536777">내 아이 ETA가 유효하면 안내</text>
