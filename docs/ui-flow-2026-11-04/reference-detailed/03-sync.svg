<text x="70.0" y="693.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="700" fill="#2165B4">4  정류장 도착</text>
<text x="70.0" y="730.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#182D3E">도착·정차 확인</text>
