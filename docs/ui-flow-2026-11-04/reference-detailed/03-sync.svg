<text x="1250.0" y="275.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#182D3E">카드는 운행 대기</text>
<text x="1250.0" y="317.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#536777">초대 연결은 최초 한 번</text>
