<polyline points="1100,595 1230,595" fill="none" stroke="#087E70" stroke-width="3" stroke-dasharray="8 6"/>
<polygon points="1230,595 1219.4690092573155,600.7531064632504 1219.4690092573155,589.2468935367496" fill="#087E70"/>
<text x="70.0" y="659.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#536777">내비 범위 밖 / 오래된 값 / 불일치 → ETA 숨김</text>
