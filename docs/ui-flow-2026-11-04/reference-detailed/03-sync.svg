<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title-03-sync desc-03-sync"><title id="title-03-sync">03  두 앱 연동 · 누가 누르면 무엇이 바뀌나요?</title><desc id="desc-03-sync">왼쪽은 차량의 조작, 가운데는 전달되는 정보, 오른쪽은 보호자가 실제로 보는 화면입니다.. 화면 번호와 조작 화살표를 따라 읽는 축약 와이어프레임입니다.</desc><rect width="100%" height="100%" fill="#F5F7FA"/>
<text x="50.0" y="36.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#182D3E">03  두 앱 연동 · 누가 누르면 무엇이 바뀌나요?</text>
<text x="50.0" y="94.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#536777">왼쪽은 차량의 조작, 가운데는 전달되는 정보, 오른쪽은 보호자가 실제로 보는 화면입니다.</text>
<text x="50.0" y="132.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#536777">파랑 실선: 화면/영역 이동    초록 점선: 같은 화면 상태 갱신    보라: 앱 밖으로 이동    주황: 미검증·예외</text>
<text x="70.0" y="199.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#182D3E">차량 앱 · 동승 선생님</text>
<text x="730.0" y="199.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#182D3E">서버 · 연결 처리</text>
<text x="1310.0" y="199.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#182D3E">학부모 앱 · 홈 카드</text>
<rect x="50" y="255" width="540" height="119" rx="14" fill="#FFFFFF" stroke="#D6DFE7"/>
<text x="70.0" y="270.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="700" fill="#2165B4">1  운행 준비</text>
<text x="70.0" y="307.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#182D3E">배정 명단으로 운행 준비</text>
<rect x="700" y="255" width="400" height="119" rx="14" fill="#EAF4F1" stroke="#EAF4F1"/>
<text x="720.0" y="278.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700" fill="#182D3E">기관·차량·어린이 연결</text>
<text x="720.0" y="334.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#087E70">자동 전달 · 접근 범위 검사</text>
