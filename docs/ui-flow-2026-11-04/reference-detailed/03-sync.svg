<text x="70.0" y="800.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#536777">이전 정류장 도착을 내 아이 도착으로 표시하지 않음</text>
