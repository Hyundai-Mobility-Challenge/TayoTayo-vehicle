<rect x="1230" y="678" width="520" height="119" rx="14" fill="#FFFFFF" stroke="#D6DFE7"/>
<text x="1250.0" y="698.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#182D3E">도착 · 인계 대기 + 알림</text>
<text x="1250.0" y="740.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#536777">버스가 내 아이 지점에 표시</text>
