<text x="1250.0" y="557.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#182D3E">정류장 진행 + 약 N분</text>
<text x="1250.0" y="599.0" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#536777">유효 ETA 0~2분 → 접근 알림</text>
<polyline points="590,595 700,595" fill="none" stroke="#087E70" stroke-width="3" stroke-dasharray="8 6"/>
