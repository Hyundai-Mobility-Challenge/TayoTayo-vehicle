<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" role="img" aria-labelledby="title-02-vehicle"><title id="title-02-vehicle">차량 앱</title><rect width="100%" height="100%" fill="#F5F7FA"/>
